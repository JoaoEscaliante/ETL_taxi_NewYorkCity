[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-yellow-taxi-etl"
version = "1.0.0"
description = "Pipeline ETL em lote com dados de táxi amarelo de NYC — validação, transformação, Parquet, dashboard Streamlit e predição de tarifas com regressão linear."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Luiza", email = "seuemail@exemplo.com" }
]

keywords = [
  "data-engineering",
  "etl",
  "batch-processing",
  "nyc-taxi",
  "streamlit",
  "machine-learning",
  "parquet",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# ── Dependências principais ────────────────────────────────────────────────────
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pyarrow>=15.0.0",
  "scikit-learn>=1.4.0",
  "streamlit>=1.35.0",
  "pydeck>=0.9.0",
  "plotly>=5.20.0",
]

# ── Dependências opcionais ─────────────────────────────────────────────────────
[project.optional-dependencies]

# Instalar com: pip install -e ".[dev]"
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "ipykernel>=6.29.0",
  "jupyterlab>=4.0.0",
]

# ── URLs do projeto ────────────────────────────────────────────────────────────
[project.urls]
Homepage   = "https://github.com/vbluuiza/YT-batch-ETL-NYC--Yellow-Taxi-Data-Engineer-First-Project"
Repository = "https://github.com/vbluuiza/YT-batch-ETL-NYC--Yellow-Taxi-Data-Engineer-First-Project"
Issues     = "https://github.com/vbluuiza/YT-batch-ETL-NYC--Yellow-Taxi-Data-Engineer-First-Project/issues"

# ── Configuração do Ruff (linter) ──────────────────────────────────────────────
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # erros de estilo (pycodestyle)
  "F",   # erros lógicos (pyflakes)
  "I",   # ordenação de imports (isort)
  "UP",  # modernização de sintaxe (pyupgrade)
]
ignore = [
  "E501",  # linha longa (já controlada pelo line-length acima)
]

# ── Configuração do Pytest ─────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths     = ["tests"]
python_files  = ["test_*.py"]
python_functions = ["test_*"]
addopts       = "-v --tb=short"

# ── Configuração do Coverage ───────────────────────────────────────────────────
[tool.coverage.run]
source = ["."]
omit   = [
  ".venv/*",
  "tests/*",
  "*.ipynb",
]

[tool.coverage.report]
show_missing = true
skip_covered = false